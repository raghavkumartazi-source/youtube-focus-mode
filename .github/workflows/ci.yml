name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: [UTC, Asia/Kolkata, America/Los_Angeles]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Package unpacked extension
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-focus-mode-${{ matrix.timezone == 'UTC' && 'UTC' || (matrix.timezone == 'Asia/Kolkata' && 'India' || 'Pacific') }}
          path: dist/*.zip
